<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>네온 두부 — 입장</title>
<style>
  :root{--paper:#fbf9f6;--ink:#16151a;--dim:#8b8679;--rule:#e2ddd2;--neon:#00d9c0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
  .card{width:min(400px,92vw);padding:34px 30px 30px;border:1px solid var(--rule);border-radius:18px;background:#fff;
    box-shadow:0 22px 60px -40px rgba(22,21,26,.6)}
  .logo{display:grid;grid-template-columns:repeat(2,13px);grid-auto-rows:13px;gap:2px;margin-bottom:16px}
  .logo i{background:var(--ink);border-radius:1px}
  .logo i:nth-child(4){background:var(--neon)}
  h1{margin:0 0 6px;font-size:23px;letter-spacing:-.04em}
  p.sub{margin:0 0 22px;color:var(--dim);font-size:13px;line-height:1.6}
  input{width:100%;padding:13px 14px;border:1px solid var(--rule);border-radius:11px;font-size:15px;
    font-family:inherit;background:#fdfcfa;outline:none}
  input:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(0,217,192,.14)}
  button{width:100%;margin-top:12px;padding:13px 14px;border:0;border-radius:11px;background:var(--ink);color:#fff;
    font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .err{margin-top:12px;font-size:13px;color:#c8362b;min-height:18px}
  .foot{margin-top:18px;font-size:11px;color:var(--dim);text-align:center}
</style>
</head>
<body>
<form class="card" id="f">
  <div class="logo"><i></i><i></i><i></i><i></i></div>
  <h1>네온 두부</h1>
  <p class="sub">요약·원문 아카이브에 대해 묻는 창입니다.<br>비밀번호를 한 번 넣으면 이 브라우저에서는 다시 묻지 않습니다.</p>
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" autofocus>
  <button id="go">입장</button>
  <div class="err" id="err"></div>
  <div class="foot">Neon Tofu · 요약만 남긴 AI 뉴스</div>
</form>
<script>
  const f = document.getElementById('f'), pw = document.getElementById('pw');
  const go = document.getElementById('go'), err = document.getElementById('err');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    go.disabled = true; err.textContent = '';
    try {
      const r = await fetch('/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: pw.value})
      });
      const data = await r.json().catch(() => ({}));
      if (r.ok) { location.href = '/'; return; }
      err.textContent = data.error || '입장 실패';
    } catch (_) {
      err.textContent = '연결 실패';
    }
    go.disabled = false; pw.select();
  });
</script>
</body>
</html>
